name: Compilar apps (APK • AAB • EXE • DEB • IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

env:
  FLUTTER_VERSION: "3.44.6"
  APP_NAME: torneo_voleibol
  VERSION: 1.0.0

jobs:
  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-aab
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Empaquetar EXE en ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath torneo_voleibol-windows-x64.zip -Force
          Get-ChildItem build/windows/x64/runner/Release/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: torneo_voleibol-windows-x64.zip

  linux:
    name: Linux DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Instalar dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev mpv
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Crear paquete .deb
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh
          ls -lh *.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: "*.deb"

  ios:
    name: iOS IPA (sin firma)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Empaquetar IPA sin firma
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/ || cp -r build/ios/iphoneos/*.app Payload/
          zip -r torneo_voleibol-unsigned.ipa Payload
          ls -lh *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: torneo_voleibol-unsigned.ipa
